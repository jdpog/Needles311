            // --- Animation Controller Class (Optimized Windowing Restored) ---
            class AnimationController {
                 constructor(map, options = {}) {
                    this.map = map;
                    this.updateInterval = options.updateInterval || 50; // Visualization redraw interval
                    this.dayTickInterval = options.dayTickInterval || 16; // Date advancement interval (rAF)
                    this.isPlaying = false;
                    this.startTimestamp = null; this.endTimestamp = null; this.currentTimestamp = null;
                    this.animationSpeed = options.initialSpeed || 1; // Multiplier for days/second
                    this.visualUpdateTimer = null; // Timer for map redraws
                    this.dayTickTimer = null;      // Timer for date advancement (rAF)
                    this.onVisualize = options.onVisualize || (() => {});
                    this.onDateUpdate = options.onDateUpdate || (() => {});
                    this.onComplete = options.onComplete || (() => {});
                    this.onChartUpdateNeeded = options.onChartUpdateNeeded || (() => {}); // Throttled chart update callback
                    this.debug = options.debug || false;
                    this.lastDayTick = 0;

                    // Data source and window
                    this.fullDataSource = []; // Holds the currently filtered (by space/keyword) and sorted data
                    this.activeReportsWindow = []; // Holds reports currently within the time window
                    this.windowStartIndex = 0; // Index in fullDataSource where the window starts (unused in cumulative)
                    this.windowEndIndex = 0;   // Index in fullDataSource *after* the last item in the window
                }

                // Set the overall date range (using timestamps)
                setDateRange(startTimestamp, endTimestamp, currentTimestamp = null) {
                    if (startTimestamp === null || endTimestamp === null) { console.error("Invalid date range provided to AnimationController"); return this; }
                    this.startTimestamp = startTimestamp; this.endTimestamp = endTimestamp;
                    // Ensure currentTimestamp is within range
                    this.currentTimestamp = Math.max(startTimestamp, Math.min(endTimestamp, currentTimestamp !== null ? currentTimestamp : startTimestamp));
                    if (this.debug) console.log("AnimationController Dates set (TS):", this.startTimestamp, this.endTimestamp, this.currentTimestamp);
                    this.updateDateDisplay();
                    // Visualization happens after data source is set and processed
                    return this;
                }

                // Set the data source (expects pre-filtered by space/keyword, sorted by dateTimestamp)
                setDataSource(filteredSortedData) {
                    this.fullDataSource = filteredSortedData;
                    // Reset window indices and rebuild the window for the current timestamp
                    this.windowStartIndex = 0;
                    this.windowEndIndex = 0;
                    this.rebuildWindow(this.currentTimestamp); // Rebuild based on new data
                    if (this.debug) console.log(`AnimationController Data Source set: ${this.fullDataSource.length} reports. Initial window size: ${this.activeReportsWindow.length}`);
                    // Don't visualize here, let the caller (processData) handle the first visualization
                    return this;
                }

                // Rebuild the active window from scratch based on a target timestamp
                // Used for initialization and jumps
                rebuildWindow(targetTimestamp) {
                    this.activeReportsWindow = [];
                    this.windowStartIndex = 0; // Reset
                    this.windowEndIndex = 0;   // Reset

                    if (!this.fullDataSource || this.fullDataSource.length === 0 || targetTimestamp === null) return;

                    // Find the reports <= targetTimestamp
                    for (let i = 0; i < this.fullDataSource.length; i++) {
                        if (this.fullDataSource[i].dateTimestamp <= targetTimestamp) {
                            this.activeReportsWindow.push(this.fullDataSource[i]);
                            this.windowEndIndex = i + 1; // End index is exclusive
                        } else {
                            break; // Stop once we pass the target timestamp (data is sorted)
                        }
                    }

                    if (this.debug) console.log(`Window rebuilt for TS ${targetTimestamp}: StartIdx=${this.windowStartIndex}, EndIdx=${this.windowEndIndex}, Size=${this.activeReportsWindow.length}`);
                }

                // **OPTIMIZED**: Efficiently update the window based on the new timestamp using indices
                updateWindow(newTimestamp) {
                    if (!this.fullDataSource || newTimestamp === null) return;

                    const oldTimestamp = this.currentTimestamp;
                    if (newTimestamp === oldTimestamp) return; // No change needed

                    if (newTimestamp > oldTimestamp) {
                        // --- Moving Forward ---
                        // Add reports that entered the window [oldTimestamp, newTimestamp]
                        for (let i = this.windowEndIndex; i < this.fullDataSource.length; i++) {
                            if (this.fullDataSource[i].dateTimestamp <= newTimestamp) {
                                // Add report to the end of the window array
                                this.activeReportsWindow.push(this.fullDataSource[i]);
                                this.windowEndIndex = i + 1; // Update end index
                            } else {
                                break; // Data is sorted, no need to check further
                            }
                        }
                        // Note: For cumulative view, we don't remove from the start when moving forward.

                    } else {
                        // --- Moving Backward ---
                        // Remove reports that are now after the new timestamp (> newTimestamp)
                        let removeCount = 0;
                        // Iterate backward through the *current* window
                        for (let i = this.activeReportsWindow.length - 1; i >= 0; i--) {
                            if (this.activeReportsWindow[i].dateTimestamp > newTimestamp) {
                                removeCount++;
                            } else {
                                break; // Stop when we find a report within the new time (data is sorted)
                            }
                        }
                        if (removeCount > 0) {
                            // Remove reports from the end of the window array
                            this.activeReportsWindow.splice(this.activeReportsWindow.length - removeCount, removeCount);
                            // Update the end index accordingly
                            this.windowEndIndex -= removeCount;
                        }
                         // Note: For cumulative view, we don't add from the start when moving backward.
                    }

                    this.currentTimestamp = newTimestamp; // Update the current timestamp AFTER modifying window
                    // if (this.debug) console.log(`Window incrementally updated for TS ${newTimestamp}: EndIdx=${this.windowEndIndex}, Size=${this.activeReportsWindow.length}`);
                }


                setSpeed(speed) { this.animationSpeed = Math.max(0.1, speed); if (this.debug) console.log("Animation Speed:", this.animationSpeed); return this; }

                // Jumps the animation to a specific timestamp
                jumpToTimestamp(timestamp) {
                     if (this.startTimestamp === null || this.endTimestamp === null) return this;
                     let targetTimestamp = timestamp;
                     if (isNaN(targetTimestamp)) return this;

                    // Clamp timestamp within the allowed range
                    targetTimestamp = Math.max(this.startTimestamp, Math.min(this.endTimestamp, targetTimestamp));

                    // Rebuild the window efficiently for the jump (rebuild is better for large jumps)
                    this.rebuildWindow(targetTimestamp);
                    this.currentTimestamp = targetTimestamp; // Set current timestamp *after* rebuild

                    if (this.debug) console.log("Jumped to TS:", this.currentTimestamp);
                    this.updateDateDisplay();
                    this.visualizeCurrentTimestamp(); // Visualize the state at the new timestamp
                    return this;
                }

                // Internal function to advance the current date based on elapsed time and speed
                _advanceDayTick(elapsedMs) {
                     if (!this.isPlaying || this.currentTimestamp === null || this.endTimestamp === null || this.startTimestamp === null) return;

                     const daysPerSecond = this.animationSpeed;
                     // Ensure elapsedMs is reasonable (prevent huge jumps if tab was inactive)
                     const safeElapsedMs = Math.min(elapsedMs, 100); // Limit jump to 100ms equivalent
                     const millisecondsToAdvance = safeElapsedMs * daysPerSecond * (24 * 60 * 60); // ms * (days/sec) * (ms/day)

                     let newTimestamp = this.currentTimestamp + millisecondsToAdvance;
                     let animationComplete = false;

                     if (newTimestamp >= this.endTimestamp) {
                         newTimestamp = this.endTimestamp;
                         animationComplete = true; // Mark completion
                     }

                     // Update the window and current timestamp using the incremental method
                     this.updateWindow(newTimestamp);
                     this.updateDateDisplay();

                      // Handle completion after updating state
                     if (animationComplete) {
                         this.pause(); // Stop the animation timers etc.
                         this.onComplete(); // Call completion callback
                         if (this.debug) console.log("Animation Complete.");
                     }
                }

                play() {
                    if (this.isPlaying || this.startTimestamp === null || this.endTimestamp === null) return false;
                    // If already at the end, restart first before playing
                    if (this.currentTimestamp >= this.endTimestamp) {
                        if (!this.restart()) return false; // Restart failed
                    }
                    this.isPlaying = true; document.body.classList.add("animation-active");
                    if (this.debug) console.log("Playing...");

                    // Start interval timer for visualization updates
                    // Clear existing timer just in case
                    clearInterval(this.visualUpdateTimer);
                    this.visualUpdateTimer = setInterval(() => {
                        if (!document.hidden) { this.visualizeCurrentTimestamp(); }
                    }, this.updateInterval);

                    // Start the date advancement loop using requestAnimationFrame
                    // Clear existing timer just in case
                    if (typeof cancelAnimationFrame === 'function') { cancelAnimationFrame(this.dayTickTimer); }
                    this.lastDayTick = performance.now(); // Reset start time for tick calculation
                    const tick = (now) => {
                        if (!this.isPlaying) return; // Stop loop if paused
                        const elapsed = now - this.lastDayTick;
                        this.lastDayTick = now;
                        // Only advance date if the tab is active/visible and elapsed time is positive
                        if (!document.hidden && elapsed > 0) {
                             this._advanceDayTick(elapsed);
                        }
                        // Request the next frame ONLY if still playing
                        if (this.isPlaying) {
                            this.dayTickTimer = requestAnimationFrame(tick);
                        }
                    };
                    this.dayTickTimer = requestAnimationFrame(tick); // Start the loop
                    return true; // Indicate success
                }

                pause() {
                    if (!this.isPlaying) return false; // Already paused
                    this.isPlaying = false; document.body.classList.remove("animation-active"); // Remove body class
                    // Clear timers
                    clearInterval(this.visualUpdateTimer); this.visualUpdateTimer = null;
                    if (typeof cancelAnimationFrame === 'function') { cancelAnimationFrame(this.dayTickTimer); } this.dayTickTimer = null;
                    if (this.debug) console.log("Paused.");
                    this.visualizeCurrentTimestamp(); // Perform one final visualization update at the paused state
                    return true; // Indicate success
                }

                restart() {
                    if (this.startTimestamp === null) return false; // Range not set
                    this.pause(); // Ensure animation is stopped first
                    this.jumpToTimestamp(this.startTimestamp); // Jump back to the beginning (this now rebuilds window and visualizes)
                    if (this.debug) console.log("Restarted.");
                    return true; // Indicate success
                }

                // Triggers the visualization callback with the current state
                visualizeCurrentTimestamp() {
                    if (this.currentTimestamp !== null) {
                        // Pass the current timestamp and the active window
                        this.onVisualize(this.currentTimestamp, this.activeReportsWindow);
                    }
                    return this;
                }

                // Triggers the date display update callback
                updateDateDisplay() {
                    if (this.currentTimestamp !== null) {
                        this.onDateUpdate(this.currentTimestamp);
                    }
                    return this;
                }

                // Request chart update via the throttled callback
                requestChartUpdate(windowData, timestamp) {
                    this.onChartUpdateNeeded(windowData, timestamp);
                }
            }

		</script>
