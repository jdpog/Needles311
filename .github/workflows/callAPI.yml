name: Daily API Data Update

on:
  schedule:
    # This cron expression schedules the workflow to run once per day at 00:00 UTC.
    - cron: "0 2 * * *"
  workflow_dispatch:

jobs:
  update_data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          token: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.x"

      - name: Install Python Dependencies
        run: pip install requests

      - name: Run API Data Download Script
        run: python data/callAPI.py

      - name: Build compact data files for the website
        # The site loads reports.core.json / reports.text.json (much smaller than
        # reports.json). If this step fails the site falls back to reports.json.
        run: python data/compact.py || echo "::warning::compact.py failed; the site will fall back to reports.json"

      - name: Generate last update timestamp
        run: |
          TIMESTAMP=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          mkdir -p data
          cat > data/last_update.js <<EOF
          // this file is auto-generated by GitHub Actions
          window.LAST_UPDATED = "${TIMESTAMP}";
          EOF
          
      - name: Commit and Push Updated JSON File
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          # Pull remote changes and rebase your changes on top.
          git pull --rebase --autostash
          git add data/reports.json data/last_update.js data/reports.core.json data/reports.text.json
          if ! git diff --cached --quiet; then
            git commit -m "Update reports.json & timestamp"
            git push
          else
            echo "No changes to commit."
          fi
